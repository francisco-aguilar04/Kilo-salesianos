<div class="tarjeta">
  <button
    type="button"
    class="tarjeta__principal"
    [disabled]="!interactiva()"
    (click)="seleccionada.emit(caja())"
  >
    <span class="icono" [style.background]="color()">{{ prefijo() }}</span>

    <span class="textos">
      <span class="codigo">{{ caja().codigo }}</span>
      <span class="detalle">{{ detalle() }}</span>
      @if (asociacion(); as nombre) {
        <p class="asociacion"><i class="bi bi-box-arrow-right"></i> {{ nombre }}</p>
      }
    </span>
    <span class="estado" [class]="'estado estado--' + caja().estado">{{ estadoTexto() }}</span>
  </button>

  <div class="tarjeta__pie"><ng-content /></div>
</div>
