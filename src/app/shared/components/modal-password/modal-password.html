<div class="capa" (click)="cerrar()">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-password"
        (click)="$event.stopPropagation()">
        <h2 id="titulo-password" class="modal-titulo">Cambiar contraseña</h2>

        <form class="formulario" (submit)="$event.preventDefault(); enviar()" novalidate>
            <label class="campo">
                <span class="campo-etiqueta">Contraseña actual</span>
                <input #campoActual type="password" autocomplete="current-password" [value]="actual()"
                    [class.invalido]="mensajeActual()" [disabled]="guardando()"
                    (input)="escribirActual(campoActual.value)" />
            </label>
            @if (mensajeActual(); as error) {
            <p class="error" role="alert">{{ error }}</p>
            }

            <label class="campo">
                <span class="campo-etiqueta">Nueva contraseña</span>
                <input #campoNueva type="password" autocomplete="new-password" [value]="nueva()"
                    [class.invalido]="errorCampoNueva()" [disabled]="guardando()"
                    (input)="escribirNueva(campoNueva.value)" />
            </label>
            @if (errorCampoNueva(); as error) {
            <p class="error" role="alert">{{ error }}</p>
            } @else {
            <p class="ayuda">Mínimo {{ minimo }} caracteres.</p>
            }

            <label class="campo">
                <span class="campo-etiqueta">Repetir nueva contraseña</span>
                <input #campoRepetir type="password" autocomplete="new-password" [value]="repetir()"
                    [class.invalido]="errorCampoRepetir()" [disabled]="guardando()"
                    (input)="escribirRepetir(campoRepetir.value)" />
            </label>
            @if (errorCampoRepetir(); as error) {
            <p class="error" role="alert">{{ error }}</p>
            }

            @if (mensajeGeneral(); as error) {
            <p class="error" role="alert">{{ error }}</p>
            }

            <div class="acciones">
                <button type="submit" class="boton primario" [disabled]="guardando()">
                    {{ guardando() ? 'Guardando…' : 'Cambiar contraseña' }}
                </button>
                <button type="button" class="boton secundario" [disabled]="guardando()" (click)="cerrar()">
                    Cancelar
                </button>
            </div>
        </form>
    </section>
</div>
