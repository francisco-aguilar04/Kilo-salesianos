<section class="barra" [style.background-color]="categoria()?.color ?? '#6b7280'">
  <div class="datos">
    <span class="estado">Caja abierta</span>
    <strong class="categoria">{{ categoria()?.nombre | titlecase }}</strong>
    <span class="codigo">{{ caja().codigo }}</span>
  </div>
  <div class="contador" aria-live="polite">
    <span class="numero">{{ caja().unidades }}</span>
    <span class="texto">{{ caja().unidades === 1 ? 'unidad' : 'unidades' }}</span>
  </div>
</section>
