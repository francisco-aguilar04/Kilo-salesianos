<div class="capa" (click)="cerrar()">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-entidad"
        (click)="$event.stopPropagation()">
        <h2 id="titulo-modal-entidad" class="modal-titulo">{{ titulo() }}</h2>

        <form class="formulario" (submit)="$event.preventDefault(); enviar()" novalidate>
            <label class="campo">
                <span class="campo-etiqueta">Nombre</span>
                <input #campoNombre type="text" autocomplete="off" placeholder="Nombre de la entidad" [value]="nombre()"
                    [class.invalido]="mensajeError()" [disabled]="guardando()"
                    (input)="escribirNombre(campoNombre.value)" />
            </label>
            @if (mensajeError(); as error) {
            <p class="error" role="alert">{{ error }}</p>
            }

            <label class="campo">
                <span class="campo-etiqueta">Contacto (opcional)</span>
                <input #campoContacto type="text" autocomplete="off" placeholder="Persona o teléfono de contacto"
                    [value]="contacto()" [disabled]="guardando()" (input)="escribirContacto(campoContacto.value)" />
            </label>

            <div class="acciones">
                <button type="submit" class="boton primario" [disabled]="guardando()">
                    {{ guardando() ? textoGuardando() : textoBoton() }}
                </button>
                <button type="button" class="boton secundario" [disabled]="guardando()" (click)="cerrar()">
                    Cancelar
                </button>
            </div>
        </form>
    </section>
</div>
