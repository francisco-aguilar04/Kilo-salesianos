<main class="perfil">
    <header class="cabecera">
        <div class="avatar">{{ iniciales() }}</div>
        <h1 class="nombre">{{ usuario()?.nombre }}</h1>
        <p class="email">{{ usuario()?.email }}</p>
        <span class="rol">{{ rolTexto() }}</span>
    </header>

    <section class="dia">
        <h2 class="dia__titulo">Tu día</h2>
        <div class="dia__tarjetas">
            <div class="tarjeta">
                <span class="tarjeta__valor">{{ cajasCerradas() }}</span>
                <span class="tarjeta__etiqueta">bolsas cerradas</span>
            </div>
            <div class="tarjeta">
                <span class="tarjeta__valor">{{ kgTexto() }}</span>
                <span class="tarjeta__etiqueta">recogidos</span>
            </div>
        </div>

        <div class="acciones">
            <button type="button" class="cambiar-password" (click)="abrirModalPassword()">
                Cambiar contraseña
            </button>
            <button type="button" class="cerrar-sesion" (click)="logout()">Cerrar sesión</button>
        </div>
    </section>
</main>

@if (modalPasswordAbierto()) {
<app-modal-password [guardando]="cambiandoPassword()" [errorActual]="errorActual()" [errorGeneral]="errorGeneral()"
    (guardar)="cambiarPassword($event)" (cancelar)="cerrarModalPassword()" />
}
