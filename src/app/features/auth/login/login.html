<main class="login">

    <h1>Campaña del Kilo</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate> <!--N se valida porq lo hace el metodo submit-->

        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />

        @if (form.controls.email.touched && form.controls.email.invalid) {

        <small class="field-error">Introduce un email válido</small>

        }

        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" />

        @if (form.controls.password.touched && form.controls.password.invalid) {

        <small class="field-error">Mínimo 6 caracteres</small>

        }

        @if (error()) {

        <p class="form-error" role="alert">{{ error() }}</p>

        }

        <button type="submit" [disabled]="loading()"> {{ loading() ? 'Entrando…' : 'Entrar' }} </button>
    </form>
</main>
