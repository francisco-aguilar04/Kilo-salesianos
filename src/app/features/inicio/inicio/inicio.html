<div class="camara">
  <app-escaner (codigoLeido)="alLeerCodigo($event)" />

  <header class="barra">
    <div class="atras-grupo">
      <button type="button" class="atras" aria-label="Introducir a mano" (click)="atras()">
        <i class="bi bi-arrow-left"></i>
      </button>
      <span class="a-mano">A mano</span>
    </div>
    <h1 class="titulo">Escanear</h1>
  </header>

  @if (!cajaAbierta() && !aviso()) {
    <div class="pista">
      <span class="pista__icono"><i class="bi bi-camera"></i></span>
      <div>
        <strong class="pista__titulo">Apunta al QR de un alimento</strong>
        <p class="pista__texto">El primer alimento abre una caja nueva de su categoría.</p>
      </div>
    </div>
  }
  @if (categoriaPendiente(); as categoria) {
    <app-hoja-nueva-caja
      [categoria]="categoria"
      [creando]="creandoCaja()"
      (crear)="confirmarNuevaCaja()"
      (cancelar)="cancelarNuevaCaja()"
    />
  }
  @if (aviso(); as a) {
    <app-aviso class="aviso-flotante" [tipo]="a.tipo" [titulo]="a.titulo" [mensaje]="a.mensaje" />
  }
</div>
